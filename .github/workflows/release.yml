name: Release RayTab

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Check release version
        id: version
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.GITHUB_REF_NAME;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version) || tag !== `v${version}`) {
            throw new Error(`Release tag ${tag} must match package.json version v${version} (vX.Y.Z).`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm test
      - run: pnpm run package
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-release-failure-artifacts
          path: artifacts/playwright/
          if-no-files-found: ignore
          retention-days: 7
      - run: pnpm run package:firefox
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            ".output/raytab-${VERSION}-chrome.zip" \
            ".output/raytab-${VERSION}-firefox.zip" \
            --verify-tag \
            --generate-notes \
            --title "RayTab $RELEASE_TAG"
